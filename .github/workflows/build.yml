name: Build desktop binaries

# Builds the LocalLLM desktop binary on a fresh Windows runner (and Linux
# for future AppImage work). Triggered manually via the Actions UI or
# automatically on every push to main, so a build artifact is always
# available without needing to cut a release.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "requirements.txt"
      - "requirements-agent.txt"
      - "pyinstaller.spec"
      - ".github/workflows/build.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        # --use-pep517 unblocks pywebview's `proxy_tools` transitive,
        # which has a broken legacy setup.py on modern setuptools.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --use-pep517 -r requirements.txt
          python -m pip install --use-pep517 -r requirements-agent.txt
          python -m pip install pyinstaller==6.16.0
      - name: Build LocalLLM.exe
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Smoke-check the binary launches
        # Fire the server, poll /api/chats, then kill it. Catches the
        # most common PyInstaller mishap (missing hidden import).
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/LocalLLM/LocalLLM.exe" `
            -ArgumentList "--no-browser","--port","8765" `
            -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/chats" -UseBasicParsing -TimeoutSec 1
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "binary didn't respond on /api/chats within 30s" }
            Write-Host "Smoke check passed"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-windows-x64
          path: dist/LocalLLM/
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --use-pep517 -r requirements.txt
          python -m pip install --use-pep517 -r requirements-agent.txt
          python -m pip install pyinstaller==6.16.0
      - name: Build LocalLLM
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Smoke-check the binary launches
        run: |
          ./dist/LocalLLM/LocalLLM --no-browser --port 8765 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/chats > /dev/null; then
              echo "Smoke check passed"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          echo "binary didn't respond on /api/chats within 30s" >&2
          exit 1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-linux-x64
          path: dist/LocalLLM/
          if-no-files-found: error
          retention-days: 30
