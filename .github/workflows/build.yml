name: Build desktop binaries

# Builds a single-file LocalLLM executable with the Ollama runtime
# embedded. The artifact is a single self-extracting .exe (Windows) /
# binary (Linux). Triggered manually via the Actions UI or automatically
# on every push to main.
#
# What goes inside the binary:
#   * The full FastAPI app + all subcommands (smart-install, build-bundle,
#     build-index, etc.) reachable via `LocalLLM.exe <subcommand>`
#   * The Chroma + BM25 RAG pipeline + tokenizer + reranker
#   * Ollama itself (downloaded fresh each build from official releases)
#
# What does NOT go inside (must live next to the .exe or under
# %LOCALAPPDATA%/LocalLLM/): the LLM model blobs (~25 GB) and the
# user's chat history / .env.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "build_support/**"
      - "requirements.txt"
      - "requirements-agent.txt"
      - "pyinstaller.spec"
      - ".github/workflows/build.yml"

env:
  # Pin the Ollama release we embed. Update this when bumping Ollama;
  # bumping it accidentally on every build would mean unverified diffs.
  OLLAMA_VERSION: "v0.4.6"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        # --use-pep517 unblocks pywebview's `proxy_tools` transitive,
        # which has a broken legacy setup.py on modern setuptools.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --use-pep517 -r requirements.txt
          python -m pip install --use-pep517 -r requirements-agent.txt
          python -m pip install pyinstaller==6.16.0
      - name: Cache Ollama bundle (${{ env.OLLAMA_VERSION }})
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: vendor/ollama
          key: ollama-${{ env.OLLAMA_VERSION }}-windows-amd64
      - name: Download embedded Ollama (${{ env.OLLAMA_VERSION }})
        # Ollama publishes a self-contained Windows zip with ollama.exe
        # plus the runner DLLs/exes for CPU + CUDA backends. We extract
        # the whole thing into vendor/ollama/ so the supervisor finds
        # both the launcher and its runners under _MEIPASS at runtime.
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/ollama/ollama/releases/download/${{ env.OLLAMA_VERSION }}/ollama-windows-amd64.zip"
          $zip = "$env:RUNNER_TEMP\ollama.zip"
          New-Item -ItemType Directory -Force -Path vendor/ollama | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath vendor/ollama -Force
          Get-ChildItem -Recurse vendor/ollama | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path "vendor/ollama/ollama.exe")) {
            throw "ollama.exe not found in extracted bundle"
          }
      - name: Build LocalLLM.exe (onefile)
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Verify single-file artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LocalLLM.exe")) {
            throw "Expected dist/LocalLLM.exe (onefile build) not found"
          }
          $size = (Get-Item dist/LocalLLM.exe).Length / 1MB
          Write-Host ("LocalLLM.exe size: {0:N1} MB" -f $size)
      - name: Smoke-check the binary launches
        # Fire the server with --no-ollama (the runner has no GPU and we
        # don't want to wait on ollama serve), poll /api/chats, then
        # shut it down. Catches PyInstaller hidden-import regressions.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/LocalLLM.exe" `
            -ArgumentList "serve","--no-browser","--no-ollama","--port","8765" `
            -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/chats" -UseBasicParsing -TimeoutSec 1
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "binary didn't respond on /api/chats within 60s" }
            Write-Host "Smoke check passed"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-check version subcommand
        # Independent check: the dispatcher correctly routes a non-default
        # subcommand AND the embedded ollama binary is discoverable.
        shell: pwsh
        run: |
          $out = & dist/LocalLLM.exe version
          Write-Host $out
          if ($out -notmatch "ollama binary:") { throw "version output missing ollama line" }
          if ($out -match "ollama binary: \(not found\)") {
            throw "embedded ollama binary not bundled"
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-windows-x64
          path: dist/LocalLLM.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --use-pep517 -r requirements.txt
          python -m pip install --use-pep517 -r requirements-agent.txt
          python -m pip install pyinstaller==6.16.0
      - name: Cache Ollama bundle (${{ env.OLLAMA_VERSION }})
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: vendor/ollama
          key: ollama-${{ env.OLLAMA_VERSION }}-linux-amd64
      - name: Download embedded Ollama (${{ env.OLLAMA_VERSION }})
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/ollama
          url="https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tgz"
          curl -fsSL "$url" -o /tmp/ollama.tgz
          tar -xzf /tmp/ollama.tgz -C vendor/ollama
          ls -la vendor/ollama
          if [ ! -x vendor/ollama/bin/ollama ]; then
            # Some releases ship the binary at the root, not under bin/
            if [ -x vendor/ollama/ollama ]; then
              echo "Found ollama at vendor/ollama/ollama — leaving as-is"
            else
              echo "ollama binary not found in extracted archive" >&2
              exit 1
            fi
          else
            mv vendor/ollama/bin/ollama vendor/ollama/ollama
          fi
          chmod +x vendor/ollama/ollama
      - name: Build LocalLLM (onefile)
        run: pyinstaller pyinstaller.spec --clean --noconfirm
      - name: Verify single-file artifact
        run: |
          if [ ! -f dist/LocalLLM ]; then
            echo "Expected dist/LocalLLM (onefile build) not found" >&2
            exit 1
          fi
          ls -lh dist/LocalLLM
      - name: Smoke-check the binary launches
        run: |
          ./dist/LocalLLM serve --no-browser --no-ollama --port 8765 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/api/chats > /dev/null; then
              echo "Smoke check passed"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          echo "binary didn't respond on /api/chats within 60s" >&2
          exit 1
      - name: Smoke-check version subcommand
        run: |
          out=$(./dist/LocalLLM version)
          echo "$out"
          echo "$out" | grep -q "ollama binary:" || { echo "version output missing ollama line" >&2; exit 1; }
          echo "$out" | grep -q "ollama binary: (not found)" && { echo "embedded ollama not bundled" >&2; exit 1; } || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-linux-x64
          path: dist/LocalLLM
          if-no-files-found: error
          retention-days: 30
